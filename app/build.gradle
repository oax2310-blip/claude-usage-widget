plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'com.oax.claudeusage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oax.claudeusage'
        minSdk 31
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // 매 빌드 같은 키로 서명해야 새 버전을 덮어쓰기 설치할 수 있음.
    // CI(ci/build.sh)가 암호화된 키(keystore/release.p12.enc)를 SIGNING_PASSWORD(GitHub Secrets)로 풀어 둠
    signingConfigs {
        release {
            storeFile file('release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('SIGNING_PASSWORD')
            keyAlias 'claudeusage'
            keyPassword System.getenv('SIGNING_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
