plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'com.oax.claudeusage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oax.claudeusage'
        minSdk 31
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // 매 빌드 같은 키로 서명해야 새 버전을 덮어쓰기 설치할 수 있음(개인용 디버그 키)
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
